name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Complete each batch so an interrupted capture cannot replace the last-good site.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-snapshots.txt
      - name: Install capture dependencies
        run: |
          python -m pip install -r requirements-snapshots.txt
          # The runner mirror has stalled for 13 minutes; use Ubuntu’s archive directly.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt
          python -m playwright install --with-deps chromium
      - name: Validate camera coverage and cache behavior
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Assemble public site
        run: |
          mkdir _site
          cp index.html styles.css app.js camera-catalog.js source-registry.json snapshot-state.js snapshot-manifest.js LICENSE _site/
      - name: Collect camera snapshots and retain last-good images
        run: python scripts/build_snapshots.py --output _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
